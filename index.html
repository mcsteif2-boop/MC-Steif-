<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6c5ce7">
<title>Conversas — Chat</title>
<style>
:root{--purple:#6c5ce7;--purple-dark:#5746d2;--ink:#202033;--muted:#8a8ba0;--line:#eeeef4;--bg:#f5f6fb;--white:#fff;--green:#39bd8b;--shadow:0 20px 60px #28264a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;display:grid;place-items:center;padding:24px}
.app{width:min(1180px,100%);height:min(790px,calc(100vh - 48px));min-height:550px;background:var(--white);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:340px 1fr;overflow:hidden}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.side-head{padding:27px 23px 20px}.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:750;letter-spacing:-.5px}.logo{width:34px;height:34px;background:var(--purple);border-radius:11px;display:grid;place-items:center;color:white;font-size:18px}.icon-btn{border:0;background:#f4f3fb;color:#68677d;border-radius:10px;width:37px;height:37px;cursor:pointer;font-size:19px}.icon-btn:hover{background:#ebe9fb;color:var(--purple)}.search{height:43px;background:#f6f6fa;border:1px solid transparent;border-radius:12px;display:flex;align-items:center;gap:9px;padding:0 12px;color:#9697a7}.search:focus-within{border-color:#d8d3ff;background:white}.search input{border:0;outline:0;background:none;width:100%;font:inherit;font-size:13px;color:var(--ink)}.section-label{padding:0 23px 9px;color:#a1a1b1;text-transform:uppercase;letter-spacing:1px;font-size:10px;font-weight:700}.conversation-list{overflow:auto;padding:0 10px 16px;flex:1}.conversation{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;cursor:pointer;color:inherit}.conversation:hover{background:#f8f7fc}.conversation.active{background:#f0efff}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:700;flex:none;position:relative;font-size:14px}.avatar:after{content:"";position:absolute;right:0;bottom:1px;width:10px;height:10px;border-radius:50%;background:#c8c8d3;border:2px solid white}.avatar.online:after{background:var(--green)}.av1{background:linear-gradient(135deg,#ff9a8b,#ff6a88)}.av2{background:linear-gradient(135deg,#5ca9fb,#4b62d1)}.av3{background:linear-gradient(135deg,#ffbf69,#f2709c)}.av4{background:linear-gradient(135deg,#52c6a2,#1c9c93)}.av5{background:linear-gradient(135deg,#b58cf2,#7b61c9)}.av6{background:linear-gradient(135deg,#8dba6e,#4e9d68)}.conv-info{min-width:0;flex:1}.conv-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:4px}.conv-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:10px;color:#a0a0af;white-space:nowrap}.preview{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--purple);color:white;border-radius:20px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-size:10px;font-weight:700}.side-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}.my-avatar{width:36px;height:36px;border-radius:50%;background:#ddd9fb;color:var(--purple);display:grid;place-items:center;font-weight:700}.profile{flex:1}.profile b{display:block;font-size:12px}.profile span{font-size:10px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-width:0;background:#fff}.chat-head{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 27px;gap:12px}.chat-head .avatar{width:43px;height:43px}.chat-person{flex:1}.chat-person b{display:block;font-size:14px}.chat-person span{color:var(--green);font-size:11px}.head-actions{display:flex;gap:8px}.head-actions .icon-btn{background:transparent}.mobile-back{display:none}.messages{flex:1;overflow:auto;padding:26px clamp(20px,5vw,65px);background-image:radial-gradient(#ecebf4 0.7px,transparent .7px);background-size:18px 18px}.day{text-align:center;font-size:10px;color:#a0a0af;margin:2px 0 25px}.message-row{display:flex;align-items:flex-end;gap:9px;margin:16px 0}.message-row.mine{justify-content:flex-end}.mini-avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;color:white;font-size:9px;font-weight:700;flex:none}.bubble-wrap{max-width:min(74%,440px)}.bubble{padding:11px 14px;border-radius:16px 16px 16px 5px;background:#f2f2f7;color:#38384a;font-size:13px;line-height:1.55;box-shadow:0 2px 4px #22221105;overflow-wrap:anywhere}.mine .bubble{background:var(--purple);color:white;border-radius:16px 16px 5px 16px}.msg-time{font-size:9px;color:#aaa9b7;margin:5px 3px 0}.mine .msg-time{text-align:right}.typing{display:flex;align-items:center;gap:4px;width:max-content;padding:12px 15px;background:#f2f2f7;border-radius:15px}.typing i{width:5px;height:5px;border-radius:50%;background:#a6a5b5;animation:bounce 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.composer-wrap{padding:16px 27px 21px;border-top:1px solid var(--line);background:#fff}.composer{display:flex;align-items:flex-end;gap:9px;padding:8px 9px 8px 14px;border:1px solid #e9e8f0;border-radius:15px;background:#fbfbfd;transition:.2s}.composer:focus-within{border-color:#c7c1ff;box-shadow:0 0 0 3px #6c5ce710}.composer textarea{resize:none;border:0;outline:0;background:transparent;font:inherit;font-size:13px;line-height:1.5;max-height:110px;min-height:25px;flex:1;padding:3px 0;color:var(--ink)}.composer textarea::placeholder{color:#a7a6b5}.attach{border:0;background:none;color:#9090a1;font-size:20px;cursor:pointer;width:31px;height:31px;border-radius:9px}.attach:hover{background:#f0efff;color:var(--purple)}.send{border:0;background:var(--purple);color:white;width:34px;height:34px;border-radius:11px;cursor:pointer;font-size:17px;display:grid;place-items:center}.send:hover{background:var(--purple-dark)}.hint{text-align:center;color:#b0afbc;font-size:9px;padding-top:9px}
@media(max-width:720px){body{padding:0}.app{height:100dvh;min-height:0;border-radius:0;grid-template-columns:1fr;width:100%}.sidebar{border:0}.chat{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.side-head{padding-top:20px}.mobile-back{display:grid}.chat-head{padding:0 15px;height:70px}.messages{padding:20px 16px}.composer-wrap{padding:12px 14px 14px}.bubble-wrap{max-width:82%}}
@media(min-width:721px){.mobile-back{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head"><div class="brand-row"><div class="brand"><div class="logo">✦</div>Conversas</div><button class="icon-btn" id="newChat" title="Nova conversa" aria-label="Nova conversa">＋</button></div><label class="search"><span>⌕</span><input id="search" placeholder="Pesquisar conversas…" autocomplete="off"></label></div>
    <div class="section-label">Mensagens recentes</div>
    <div class="conversation-list" id="conversationList"></div>
    <div class="side-foot"><div class="my-avatar">MC</div><div class="profile"><b>MC Steif</b><span>Disponível</span></div><button class="icon-btn" title="Definições" aria-label="Definições">⚙</button></div>
  </aside>
  <main class="chat">
    <header class="chat-head"><button class="icon-btn mobile-back" id="back" aria-label="Voltar">‹</button><div id="headAvatar" class="avatar av1 online">AM</div><div class="chat-person"><b id="headName">Ana Martins</b><span id="headStatus">● Online</span></div><div class="head-actions"><button class="icon-btn" title="Pesquisar nesta conversa" aria-label="Pesquisar nesta conversa">⌕</button><button class="icon-btn" title="Mais opções" aria-label="Mais opções">⋯</button></div></header>
    <section class="messages" id="messages" aria-live="polite"></section>
    <div class="composer-wrap"><form class="composer" id="messageForm"><button type="button" class="attach" title="Anexar ficheiro" aria-label="Anexar ficheiro">＋</button><textarea id="messageInput" placeholder="Escreve uma mensagem…" rows="1"></textarea><button class="send" aria-label="Enviar mensagem" type="submit">➤</button></form><div class="hint">Enter para enviar · Shift + Enter para nova linha</div></div>
  </main>
</div>
<script>
const people=[
 {id:'ana',name:'Ana Martins',initials:'AM',av:'av1',online:true,time:'19:02',preview:'Perfeito! Até já 😊',unread:0,messages:[['them','Olá! Como estás? Já viste as fotos do fim de semana?','18:42'],['mine','Olá, Ana! Estou bem 😊 Ainda não vi, vou espreitar agora.','18:45'],['them','Estão mesmo giras! Temos de combinar outro passeio destes.','18:47'],['mine','Combinado! Para onde vamos da próxima vez?','18:51'],['them','Podíamos ir à praia no próximo sábado. O que achas?','18:55'],['mine','Adoro a ideia. Vou ver como está o tempo e combinamos!','18:58'],['them','Perfeito! Até já 😊','19:02']]},
 {id:'grupo',name:'Família ❤️',initials:'F',av:'av2',online:true,time:'18:36',preview:'Mãe: Tragam sobremesa!',unread:2,messages:[['them','Mãe','Hoje almoçamos todos juntos no domingo?','18:20'],['mine','Claro! Que bom, já estava com saudades.','18:24'],['them','Mãe','Tragam sobremesa!','18:36']]},
 {id:'joao',name:'João Pedro',initials:'JP',av:'av3',online:false,time:'17:51',preview:'Obrigado pela ajuda, amigo!',unread:0,messages:[['them','Conseguiste ver aquele documento?','17:42'],['mine','Sim, está tudo certo. Fiz umas pequenas correções e enviei-te.','17:47'],['them','Obrigado pela ajuda, amigo!','17:51']]},
 {id:'carla',name:'Carla Mendes',initials:'CM',av:'av4',online:true,time:'16:08',preview:'Encontro marcado então ✨',unread:0,messages:[['them','Tens tempo para um café esta semana?','15:55'],['mine','Tenho sim! Quinta-feira funciona?','16:02'],['them','Encontro marcado então ✨','16:08']]},
 {id:'trabalho',name:'Equipa de trabalho',initials:'ET',av:'av5',online:false,time:'Ontem',preview:'Rui: Reunião às 10h amanhã',unread:0,messages:[['them','Rui','Pessoal, reunião às 10h amanhã. Não se esqueçam!','Ontem'],['mine','Obrigado pelo aviso! Até amanhã.','Ontem']]},
 {id:'miguel',name:'Miguel Costa',initials:'MC',av:'av6',online:false,time:'Ontem',preview:'Boa noite! Falamos amanhã.',unread:0,messages:[['them','Como correu o jogo?','Ontem'],['mine','Foi muito bom! A equipa jogou mesmo bem.','Ontem'],['them','Boa noite! Falamos amanhã.','Ontem']]}
];
let active='ana';
const list=document.querySelector('#conversationList'), messages=document.querySelector('#messages'), app=document.querySelector('#app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderList(filter=''){list.innerHTML='';people.filter(p=>(p.name+' '+p.preview).toLowerCase().includes(filter.toLowerCase())).forEach(p=>{const b=document.createElement('button');b.className='conversation'+(p.id===active?' active':'');b.innerHTML=`<div class="avatar ${p.av} ${p.online?'online':''}">${esc(p.initials)}</div><div class="conv-info"><div class="conv-top"><span class="conv-name">${esc(p.name)}</span><span class="time">${esc(p.time)}</span></div><div class="conv-top" style="margin:0"><span class="preview">${esc(p.preview)}</span>${p.unread?`<span class="badge">${p.unread}</span>`:''}</div></div>`;b.onclick=()=>selectChat(p.id);list.append(b)})}
function selectChat(id){active=id;const p=people.find(x=>x.id===id);p.unread=0;document.querySelector('#headName').textContent=p.name;const av=document.querySelector('#headAvatar');av.className=`avatar ${p.av} ${p.online?'online':''}`;av.textContent=p.initials;document.querySelector('#headStatus').textContent=p.online?'● Online':'Visto recentemente';renderList(document.querySelector('#search').value);renderMessages();app.classList.add('chat-open')}
function renderMessages(){const p=people.find(x=>x.id===active);messages.innerHTML='<div class="day">HOJE</div>'+p.messages.map(m=>{let who=m[0],name=m.length===4?m[1]:p.name,text=m.length===4?m[2]:m[1],time=m.length===4?m[3]:m[2];return `<div class="message-row ${who==='mine'?'mine':''}">${who==='them'?`<div class="mini-avatar ${p.av}">${esc(p.initials)}</div>`:''}<div class="bubble-wrap"><div class="bubble">${m.length===4?`<b>${esc(name)}:</b> `:''}${esc(text).replace(/\n/g,'<br>')}</div><div class="msg-time">${esc(time)} ${who==='mine'?' · ✓✓':''}</div></div></div>`}).join('');messages.scrollTop=messages.scrollHeight}
function sendMessage(text){text=text.trim();if(!text)return;const p=people.find(x=>x.id===active),now=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});p.messages.push(['mine',text,now]);p.preview=text;p.time=now;renderMessages();renderList(document.querySelector('#search').value)}
document.querySelector('#messageForm').addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#messageInput');sendMessage(input.value);input.value='';input.style.height='auto';input.focus()});
const input=document.querySelector('#messageInput');input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#messageForm').requestSubmit()}});
document.querySelector('#search').addEventListener('input',e=>renderList(e.target.value));document.querySelector('#back').onclick=()=>app.classList.remove('chat-open');document.querySelector('#newChat').onclick=()=>{const name=prompt('Nome da nova conversa:');if(!name?.trim())return;const id='new'+Date.now(),initials=name.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();people.unshift({id,name:name.trim(),initials,av:'av5',online:false,time:'Agora',preview:'Começa uma conversa…',unread:0,messages:[]});selectChat(id);input.focus()};
renderList();renderMessages();
</script>
</body>
</html>
